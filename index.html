<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi web en Netlify</title>

<body style="font-family: Arial, sans-serif; margin: 24px;">
